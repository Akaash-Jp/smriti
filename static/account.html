<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Smriti</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/portal.css"></head>
<body class="portal-body" data-page="account">
<!-- This small header links back to discovery without distracting from sign-in. -->
<header class="portal-header"><a class="portal-brand" href="/"><span>✦</span> SMRITI</a><nav class="portal-nav"><a href="/explore">Explore</a><span data-account-link></span></nav></header>
<main class="portal-main"><section class="panel" style="max-width:560px;margin:auto"><p class="portal-kicker">Contributor access</p><h1 id="accountTitle">Welcome back</h1><p>Sign in to save guides, submit them for review, and follow their status.</p>
<!-- Registration and login use the same clear fields so the page stays simple. -->
<form class="form-grid" id="accountForm"><label class="field">Email address<input name="email" type="text" autocomplete="username" placeholder="you@example.com" required></label><label class="field">Password<input name="password" type="password" minlength="8" autocomplete="current-password"></label><button class="primary-action" type="submit">Continue</button></form><p class="status-message" id="accountStatus" aria-live="polite"></p><button class="link-button" id="switchMode" type="button">Need an account? Register</button></section></main><script src="/static/portal.js"></script></body></html>
