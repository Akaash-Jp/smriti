<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in — Heritage-101</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/header.css">
    <link rel="stylesheet" href="/static/portal.css">
</head>
<body class="portal-body" data-page="account">
    <!-- Every page uses the same homepage header. -->
    <header class="site-header scrolled">
        <a class="brand" href="/" aria-label="Heritage-101 home"><span class="brand-mark" aria-hidden="true">✦</span><span class="brand-name">HERITAGE-101</span><span class="brand-divider" aria-hidden="true"></span><span class="brand-tagline">The Living Heritage Network</span></a>
        <button class="menu-button" id="menuButton" type="button" aria-expanded="false" aria-controls="siteNav"><span class="menu-line"></span><span class="menu-line"></span><span class="menu-line"></span><span class="sr-only">Open navigation</span></button>
        <nav class="site-nav" id="siteNav" aria-label="Main navigation"><a class="nav-link" href="/">Home</a><a class="nav-link" href="/explore">Explore</a><a class="nav-link" href="/map">Map</a><a class="nav-link" href="/#contribute">Contribute</a><div class="account-menu-slot" data-account-menu><a class="nav-link nav-cta" href="/account" aria-current="page">Sign in <span aria-hidden="true">→</span></a></div></nav>
    </header>
    <main class="portal-main">
        <section class="panel" style="max-width:560px;margin:auto">
            <p class="portal-kicker">Contributor access</p><h1 id="accountTitle">Welcome back</h1><p>Sign in to save guides, submit them for review, and follow their status.</p>
            <form class="form-grid" id="accountForm"><label class="field">Email address<input name="email" type="text" autocomplete="username" placeholder="you@example.com" required></label><label class="field">Password<input name="password" type="password" minlength="8" autocomplete="current-password"></label><button class="primary-action" type="submit">Continue</button></form>
            <p class="status-message" id="accountStatus" aria-live="polite"></p><button class="link-button" id="switchMode" type="button">Need an account? Register</button>
        </section>
    </main>
    <script src="/static/header.js"></script><script src="/static/portal.js"></script>
</body>
</html>
